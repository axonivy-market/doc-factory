name: Release-Build

on: 
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: 25
        distribution: temurin
        server-id: github

    - name: Configure Git
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git checkout -b new-release
    
    - name: Provide maven repository credentials
      uses: s4u/maven-settings-action@v2
      with:
        servers: |
          [{
              "id": "nexus.axonivy.com",
              "username": "${{ secrets.NEXUS_AXONIVY_COM_USER }}",
              "password": "${{ secrets.NEXUS_AXONIVY_COM_PASSWORD }}"
          }]

    - name: Setup Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.10.0

    - name: Determine release tag
      id: release
      run: |
        version="$(mvn --batch-mode -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
        if [[ "$version" != *-SNAPSHOT ]]; then
          echo "::error::Expected a SNAPSHOT project version, got $version."
          exit 1
        fi
        echo "tag=v${version%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

    - name: Build with Maven
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn --batch-mode -Darguments="-Dmaven.test.skip=true -DaltDeploymentRepository=nexus.axonivy.com::https://nexus.axonivy.com/repository/maven-releases/" release:prepare release:perform

    - name: Save release tag for publishing
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
      run: |
        git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
        printf '%s\n' "$RELEASE_TAG" > release-tag.txt

    - uses: actions/upload-artifact@v4
      with:
        name: release-tag
        path: release-tag.txt
        retention-days: 1

    - name: Create pull request
      uses: repo-sync/pull-request@v2
      with:
        destination_branch: ${{ steps.branch-name.outputs.current_branch }}
        source_branch: new-release
        pr_title: "Release"
        github_token: ${{ secrets.GITHUB_TOKEN }}
